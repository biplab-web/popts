<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>🫧 Bubble Pop – For Pragya 🌸</title>
<style>
  :root{
    color-scheme: dark;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; }
  body {
    background:
      radial-gradient(circle at top, rgba(255,120,180,.18), transparent 34%),
      linear-gradient(135deg, #140b24 0%, #2e1349 100%);
    display:grid;
    place-items:center;
    overflow:hidden;
    font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif;
    padding:clamp(10px, 3vw, 24px);
    color:#fff;
  }
  .app-shell{
    width:min(100%, 470px);
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .phone-frame{
    position:relative;
    width:100%;
    aspect-ratio: 9 / 19.2;
    max-height:min(92dvh, 860px);
    border-radius:38px;
    padding:12px;
    background: linear-gradient(145deg, #2d223c, #120815);
    box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.14);
  }
  .phone-notch{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:120px; height:28px; border-radius:0 0 18px 18px;
    background:rgba(0,0,0,.75);
    z-index:3;
  }
  .phone-screen{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    border-radius:28px;
    background:#0a0611;
    border:1px solid rgba(255,255,255,.08);
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .phone-home{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    width:110px; height:5px; border-radius:999px;
    background:rgba(255,255,255,.15);
    z-index:3;
  }
  .menu-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(8,5,16,0.72);
    z-index:4;
    padding:24px;
  }
  .menu-card{
    width:min(100%, 280px);
    padding:24px 20px;
    border-radius:24px;
    background:linear-gradient(145deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08));
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 16px 40px rgba(0,0,0,0.28);
    text-align:center;
    backdrop-filter:blur(10px);
  }
  .menu-title{ font-size:24px; margin-bottom:10px; }
  .menu-text{ font-size:14px; line-height:1.5; color:#f8e8ff; margin-bottom:16px; }
  .play-btn{
    border:none;
    border-radius:999px;
    padding:12px 18px;
    font-size:16px;
    font-weight:700;
    color:#2d0f3b;
    background:linear-gradient(135deg, #ffd8ee, #ff9fd6);
    cursor:pointer;
    box-shadow:0 10px 20px rgba(255,128,192,0.24);
  }
  .play-btn:active{ transform:scale(0.97); }
</style>
</head>
<body>
  <div class="app-shell">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <canvas id="c"></canvas>
        <div id="menuOverlay" class="menu-overlay">
          <div class="menu-card">
            <div class="menu-title">🌸 Bubble Pop</div>
            <div class="menu-text">Tap the bubbles, keep the mood bright, and enjoy a little love-filled playtime.</div>
            <button id="playBtn" class="play-btn">Play Game</button>
          </div>
        </div>
      </div>
      <div class="phone-home"></div>
    </div>
  </div>
<script src="game.js"></script>
</body>
</html>
